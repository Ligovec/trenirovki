<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d0c" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Тренировки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap&subset=cyrillic">
<style>
:root{--bg:#f3f4ef;--card:#fff;--card2:#eef0e9;--tx:#121512;--tx2:#545b55;--tx3:#8a918b;--bd:#e2e5dd;--bd2:#d0d5cc;
--ac:#0b8f63;--acbg:#d9f4e7;--actx:#055a3d;--on:#fff;
--h:#d4462f;--hbg:#fde6e1;--m:#b0740a;--mbg:#fbefd2;--l:#3c8619;--lbg:#e4f3d6;
--r:20px;--sh:0 1px 2px rgba(20,35,25,.04),0 6px 18px rgba(20,35,25,.06);
--fh:"Unbounded",system-ui,sans-serif;--fb:"Manrope",system-ui,-apple-system,Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d0c;--card:#151917;--card2:#1e2320;--tx:#eef1ed;--tx2:#a3aba5;--tx3:#6c756e;--bd:#222825;--bd2:#2e3531;
--ac:#3ee39b;--acbg:#11382a;--actx:#93f2c6;--on:#04241a;
--h:#ff7b66;--hbg:#3a1611;--m:#ffc451;--mbg:#372809;--l:#9ce370;--lbg:#1a330f;--sh:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:500 16px/1.45 var(--fb);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
#top,#app{max-width:560px;margin:0 auto}
#top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(12px + env(safe-area-inset-top)) 16px 10px}
#app{padding:4px 16px 28px}
h1{font:600 24px/1.2 var(--fh);letter-spacing:-.01em;margin:6px 0}
p{margin:0}.mut{color:var(--tx2);font-size:14px}.sm{font-size:13px;color:var(--tx3)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--sh)}
.tap{cursor:pointer;transition:transform .12s}.tap:active{transform:scale(.985)}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.g1{flex:1;min-width:0}
button{font:600 15px var(--fb);color:var(--tx);background:var(--card);border:1px solid var(--bd2);border-radius:14px;min-height:42px;padding:6px 14px;cursor:pointer;transition:transform .1s,background .15s}
button:active{transform:scale(.96)}button:disabled{opacity:.35}
.pri{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:700}
.ghost{border-color:transparent;background:transparent;color:var(--ac);padding:6px 8px}
.big{width:100%;min-height:54px;font-size:16px;margin-top:12px;border-radius:16px}
input,select,textarea{font:600 16px var(--fb);color:var(--tx);background:var(--card2);border:1px solid transparent;border-radius:14px;min-height:46px;padding:8px 12px;width:100%}
input::placeholder,textarea::placeholder{color:var(--tx3);font-weight:500}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);background:var(--card)}
.num{width:76px;text-align:center;padding:8px 4px;font-size:18px;font-weight:700}
.seg{display:flex;gap:4px;background:var(--card2);border-radius:16px;padding:4px}
.seg button{flex:1;border:0;min-height:40px;background:transparent;color:var(--tx2);border-radius:12px}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.t button.on.h{background:var(--hbg);color:var(--h)}.seg.t button.on.m{background:var(--mbg);color:var(--m)}.seg.t button.on.l{background:var(--lbg);color:var(--l)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.h{background:var(--hbg);color:var(--h)}.pill.m{background:var(--mbg);color:var(--m)}.pill.l{background:var(--lbg);color:var(--l)}
.pill.ac{background:var(--acbg);color:var(--actx)}.pill.nt{background:var(--card2);color:var(--tx2)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.exn{font:700 17px/1.3 var(--fb);text-align:left;border:0;background:none;padding:0;min-height:0;color:var(--tx);display:inline-flex;align-items:center;gap:8px}
.exn .sw{flex:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:9px;background:var(--card2);color:var(--tx2)}
.exn .sw svg{width:16px;height:16px}
.lbl{font:600 11px var(--fh);letter-spacing:.06em;text-transform:uppercase;color:var(--tx3)}
.setr{display:flex;align-items:center;gap:8px;margin-top:10px}
.setr .i{width:26px;height:26px;border-radius:50%;background:var(--card2);color:var(--tx2);font:600 12px/26px var(--fh);text-align:center;flex:none}
.setr .x{color:var(--tx3);font-weight:700}
.setr .i.on{background:var(--ac);color:var(--on)}
.setr .hd{width:76px;text-align:center}
.ck{width:48px;min-width:48px;height:46px;padding:0;border-radius:14px;font-size:20px;color:var(--tx3);background:var(--card2);border-color:transparent}
.ck.on{background:var(--ac);color:var(--on)}
.chip{min-width:46px;height:46px;padding:0 12px;border-radius:14px;background:var(--card2);border-color:transparent;font-family:var(--fh);font-size:14px}
.chip.on{background:var(--ac);color:var(--on)}
.sec{font:600 12px var(--fh);letter-spacing:.08em;color:var(--tx3);text-transform:uppercase;margin:26px 0 2px}
.dec button{flex:1}.dec button.on{background:var(--ac);border-color:var(--ac);color:var(--on)}
.dec button.sug:not(.on){border:2px solid var(--ac);color:var(--ac)}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
#nav .in{display:flex;max-width:560px;width:100%;padding:6px 8px}
#nav button{flex:1;border:0;background:none;min-height:60px;font-size:12px;font-weight:600;color:var(--tx3);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0}
#nav button span{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:15px;transition:background .2s}
#nav button svg{width:22px;height:22px}
#nav button.on{color:var(--tx)}#nav button.on span{background:var(--acbg);color:var(--actx)}
#sheet{position:fixed;inset:0;z-index:10;display:none;background:rgba(0,0,0,.5)}
#sheet.open{display:flex;align-items:flex-end;justify-content:center}
#sheet .box{background:var(--card);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:0 16px calc(24px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.shd{position:sticky;top:0;background:var(--card);padding:10px 0 10px;z-index:1}
.grab{width:40px;height:5px;border-radius:3px;background:var(--bd2);margin:0 auto 12px}
.li{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;border:0;border-radius:14px;background:none;min-height:50px;padding:8px 12px;font-weight:600}
.li:active{background:var(--card2)}
.li.cur{background:var(--acbg);color:var(--actx)}
.li.alt1{background:var(--card2);margin-top:6px}
.gr{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;border-top:1px solid var(--bd);border-radius:0;background:none;min-height:52px;padding:8px 4px;font:600 15px var(--fb)}
.empty{text-align:center;color:var(--tx2);padding:40px 10px}
.chart{width:100%;height:auto;display:block}
.alt{display:inline-flex;align-items:center;gap:2px;background:var(--card2);border-radius:999px;padding:2px 4px 2px 12px;margin:6px 6px 0 0;font-size:14px;font-weight:600}
.alt button{min-height:30px;padding:0 8px;border:0;background:none;color:var(--tx3)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:20;font-size:15px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.brand b{font:700 15px var(--fh);letter-spacing:.02em}
.brand i{font-style:normal;font-size:12px;color:var(--tx3);font-weight:600}
.profs{display:flex;gap:8px}
.profs button{flex:1;display:flex;align-items:center;gap:10px;justify-content:flex-start;padding:6px 10px;min-height:48px;border-radius:16px;background:var(--card);border-color:var(--bd)}
.profs button .av{width:32px;height:32px;border-radius:50%;background:var(--card2);color:var(--tx2);font:700 13px/32px var(--fh);text-align:center;flex:none}
.profs button.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.profs button.on .av{background:var(--ac);color:var(--on)}
.hero{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:18px;margin:6px 0 4px;box-shadow:var(--sh)}
.hero .n{font:700 52px/1 var(--fh);letter-spacing:-.03em}
.bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden;margin-top:14px}.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}
.arr{width:44px;height:44px;padding:0;border-radius:50%;font-size:20px;background:var(--card2);border-color:transparent}
.wo{display:flex;gap:14px;align-items:flex-start}
.wo .no{flex:none;width:52px;height:52px;border-radius:16px;background:var(--card2);font:700 18px/52px var(--fh);text-align:center;color:var(--tx2)}
.wo .no.done{background:var(--ac);color:var(--on)}
.wo .ex{font-size:14px;color:var(--tx2);margin-top:6px;display:block;overflow-wrap:anywhere}
.wo .ex .g1{display:block}
.wo .ex b{display:block;color:var(--tx);font-weight:700;font-size:13px;margin-top:1px}
.acc{border-left:0;position:relative;overflow:hidden}
.acc:before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--ac)}
.tgt{font:600 12px var(--fh);color:var(--actx);background:var(--acbg);padding:5px 10px;border-radius:10px;white-space:nowrap}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.stat .v{font:700 24px/1.2 var(--fh);margin:4px 0}
</style>
</head>
<body>
<header id="top"></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="sheet"><div class="box" id="sbox"></div></div>
<script src="catalog.js"></script>
<script>
'use strict';
/* ========== Хранилище ========== */
const KEY = 'trenirovki.v1';
const TYPES = {h: 'Тяжёлая', m: 'Средняя', l: 'Лёгкая'};
const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
const num = x => (x === '' || x == null) ? NaN : parseFloat(String(x).replace(',', '.'));
const fw = n => isNaN(n) ? '' : String(Math.round(n * 100) / 100).replace('.', ',');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const fdate = iso => iso ? new Date(iso + 'T12:00').toLocaleDateString('ru-RU', {weekday: 'short', day: 'numeric', month: 'short'}) : '';
const e1rm = (w, r) => r <= 1 ? w : w * (1 + r / 30);

function buildCatalog() {
  const cat = {};
  for (const g in window.CATALOG) for (const n of window.CATALOG[g]) { const id = uid(); cat[id] = {id, name: n, g, step: 2.5}; }
  return cat;
}
function exByName(cat, name) { for (const id in cat) if (cat[id].name === name) return id; return null; }

function seedProgram(cat) {
  const X = n => { const id = exByName(cat, n); if (!id) throw new Error('нет упражнения ' + n); return id; };
  const s = (n, acc, alts = []) => ({id: uid(), ex: X(n), alts: alts.map(X), acc: !!acc, sets: acc ? 2 : 4, rmin: acc ? 6 : 8, rmax: 10});
  return [
    {id: uid(), name: 'Тренировка 1', focus: 'Грудь', slots: [
      s('Жим штанги на наклонной', 1, ['Жим гантелей на наклонной', 'Жим в Смите на наклонной', 'Жим в тренажёре на наклонной', 'Жим штанги лёжа', 'Жим гантелей лёжа']),
      s('Сведение в кроссовере', 1, ['Сведение в тренажёре (бабочка)', 'Жим в тренажёре сидя', 'Разводка гантелей лёжа', 'Отжимания на брусьях']),
      s('Жим ногами', 0, ['Гакк-присед', 'Выпады с гантелями']),
      s('Разведение ног в тренажёре', 0, ['Сведение ног в тренажёре']),
      s('Подтягивания', 0, ['Тяга вертикального блока']),
      s('Молоты', 0, ['Подъём гантелей на бицепс'])]},
    {id: uid(), name: 'Тренировка 2', focus: 'Ноги', slots: [
      s('Присед со штангой', 1, ['Присед в Смите', 'Гакк-присед', 'Фронтальный присед', 'Жим ногами']),
      s('Румынская тяга', 1, ['Румынская тяга с гантелями', 'Становая на прямых ногах', 'Гуд морнинг']),
      s('Махи гантелями в стороны', 0, ['Махи в кроссовере в сторону', 'Махи в тренажёре в стороны']),
      s('Тяга горизонтального блока', 0, ['Тяга гантели одной рукой', 'Тяга Т-грифа']),
      s('Французский жим на канате', 0, ['Разгибание на блоке с канатом', 'Французский жим лёжа']),
      s('Разгибание с прямой рукоятью', 0, ['Разгибание одной рукой на блоке'])]},
    {id: uid(), name: 'Тренировка 3', focus: 'Жим', slots: [
      s('Жим штанги лёжа', 1, ['Жим гантелей лёжа', 'Жим в Смите лёжа']),
      s('Протяжка (тяга штанги к подбородку)', 1, ['Жим гантелей сидя', 'Махи гантелями в стороны']),
      s('Задняя дельта в тренажёре', 0, ['Махи в наклоне на заднюю дельту', 'Лицевая тяга']),
      s('Тяга вертикального блока', 0, ['Подтягивания', 'Тяга вертикального блока узким хватом']),
      s('Сгибание ног лёжа', 0, ['Сгибание ног сидя']),
      s('Бицепс на наклонной скамье', 0, ['Подъём штанги на бицепс', 'Подъём гантелей на бицепс']),
      s('Сгибания на блоке', 0, ['Молоты', 'Сгибания на скамье Скотта'])]},
    {id: uid(), name: 'Тренировка 4', focus: 'Спина', slots: [
      s('Подтягивания с весом', 1, ['Тяга вертикального блока', 'Тяга штанги в наклоне']),
      s('Жим гантелей сидя', 1, ['Жим штанги стоя', 'Жим в тренажёре на плечи']),
      s('Тяга горизонтального блока', 0, ['Тяга Т-грифа', 'Тяга гантели одной рукой']),
      s('Разгибание на блоке с канатом', 0, ['Французский жим на канате']),
      s('Сведение в тренажёре (бабочка)', 0, ['Сведение в кроссовере']),
      s('Скручивания', 0, ['Подъём ног в висе', 'Планка'])]}
  ];
}
const newWeek = (n, plan = {}) => ({id: uid(), n, created: today(), plan, sessions: {}});
function seed() {
  const cat = buildCatalog();
  const mk = (id, name) => ({id, name, workouts: seedProgram(cat), weeks: [newWeek(1)]});
  return {v: 1, cat, order: ['p1', 'p2'], profiles: {p1: mk('p1', 'Я'), p2: mk('p2', 'Партнёр')}, active: 'p1', owner: 'p1', setup: false};
}
const initials = n => (String(n || '?').trim()[0] || '?').toUpperCase();
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) return s; } catch (e) {} return seed(); }
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Не удалось сохранить: ' + e.message); } }
save();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

/* ========== Состояние экрана ========== */
let V = {tab: 'week', wk: null};
const P = () => S.profiles[S.active];
const EX = id => S.cat[id] || {name: '(удалено)', step: 2.5, g: ''};
const wkIdx = () => { const p = P(); return (V.wk == null || V.wk >= p.weeks.length) ? p.weeks.length - 1 : V.wk; };
const WO = wid => P().workouts.find(w => w.id === wid);
// тренировка по ключу: шаблон из программы или своя (свободная) тренировка этой недели
function WOS(key) { const o = WO(key); if (o) return o; const s = P().weeks[wkIdx()].sessions[key]; return s ? {id: key, name: s.title || 'Своя тренировка', focus: '', slots: [], free: true} : null; }
const CARDIO = ['Ходьба', 'Бег', 'Велосипед', 'Плавание', 'Эллипс', 'Скакалка', 'Другое'];
function go(nv, replace) { V = Object.assign({}, nv); if (replace) history.replaceState(V, ''); else history.pushState(V, ''); render(); scrollTo(0, 0); }
addEventListener('popstate', e => { closeSheet(); V = e.state || {tab: 'week'}; render(); });

function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }

/* ========== История и подсчёты ========== */
function sess(week, wid, create) {
  let s = week.sessions[wid];
  if (!s && create) { const pl = week.plan[wid]; s = week.sessions[wid] = {date: '', type: (pl && pl.type) || 'm', done: false, note: '', by: '', e: {}, extra: []}; }
  return s;
}
function slotsOf(w, s) { return w.slots.concat(s && s.extra ? s.extra : []); }
function entryData(e) {
  const sets = (e.sets || []).map(x => ({w: num(x.w), r: num(x.r), d: !!x.d})).filter(x => x.r > 0);
  return {sets, aw: num(e.w), cd: (e.c || []).filter(Boolean).length, cn: (e.c || []).length};
}
function hasData(s) {
  if (!s) return false;
  for (const k in s.e) { const d = entryData(s.e[k]); if (d.sets.length || !isNaN(d.aw) || d.cd) return true; }
  return !!s.note;
}
function hist(p, exId) {
  const out = [];
  p.weeks.forEach((w, wi) => {
    for (const wid in w.sessions) {
      const s = w.sessions[wid];
      for (const sid in s.e) {
        const e = s.e[sid]; if (e.ex !== exId) continue;
        const d = entryData(e); if (!d.sets.length && isNaN(d.aw) && !d.cd) continue;
        out.push(Object.assign(d, {wi, wn: w.n, wid, sid, date: s.date || w.created, type: s.type}));
      }
    }
  });
  out.sort((a, b) => a.date.localeCompare(b.date) || a.wi - b.wi);
  return out;
}
function topSet(h) {
  if (h.sets.length) { let b = null; for (const x of h.sets) { const w = isNaN(x.w) ? 0 : x.w; if (!b || w > b.w || (w === b.w && x.r > b.r)) b = {w, r: x.r}; } return b; }
  return isNaN(h.aw) ? null : {w: h.aw, r: NaN};
}
function bestE1(h) { let b = NaN; for (const x of h.sets) { if (isNaN(x.w)) continue; const v = e1rm(x.w, x.r); if (isNaN(b) || v > b) b = v; } return b; }
function summ(h) {
  if (h.sets.length) {
    const g = [];
    for (const x of h.sets) { const l = g[g.length - 1]; if (l && (l.w === x.w || (isNaN(l.w) && isNaN(x.w))) && l.r === x.r) l.n++; else g.push({w: x.w, r: x.r, n: 1}); }
    return g.map(x => (isNaN(x.w) ? 'с.в.' : fw(x.w)) + ' × ' + x.r + (x.n > 1 ? ' × ' + x.n : '')).join(', ');
  }

/* ---- Прогресс ---- */
function rProg() {
  const p = P(), ids = {};
  for (const w of p.weeks) for (const wid in w.sessions) for (const k in w.sessions[wid].e) ids[w.sessions[wid].e[k].ex] = 1;
  const list = Object.keys(ids).map(id => ({id, h: hist(p, id)})).filter(x => x.h.length)
    .sort((a, b) => b.h[b.h.length - 1].date.localeCompare(a.h[a.h.length - 1].date));
  let h = `<h1 style="margin-top:8px">Прогресс</h1>`;
  const cw = p.weeks.slice(-8).map(w => ({n: w.n, m: (w.cardio || []).reduce((a, c) => a + (num(c.min) || 0), 0)}));
  const cmax = Math.max(...cw.map(x => x.m));
  const cs = cmax > 0 ? `<p class="sec">Кардио по неделям, мин</p><div class="card"><div class="row" style="align-items:flex-end;gap:6px;height:120px">${cw.map(x => `<div class="g1" style="text-align:center"><p class="sm" style="font-weight:700;color:var(--tx2)">${x.m || ''}</p><div style="height:${Math.round(x.m / cmax * 80)}px;min-height:3px;background:var(--ac);border-radius:6px 6px 2px 2px;margin-top:4px"></div><p class="sm">н.${x.n}</p></div>`).join('')}</div></div>` : '';
  if (!list.length) return h + `<p class="empty">Здесь появятся графики, когда внесёшь первые тренировки.</p>` + cs;
  if (!V.ex || !list.find(x => x.id === V.ex)) V.ex = list[0].id;
  const cur = list.find(x => x.id === V.ex), metric = V.metric || 'w';
  h += `<select data-i="pex">${list.map(x => `<option value="${x.id}" ${x.id === V.ex ? 'selected' : ''}>${esc(EX(x.id).name)} (${x.h.length})</option>`).join('')}</select>
    <div class="seg" style="margin:10px 0"><button data-a="metric" data-v="w" class="${metric === 'w' ? 'on' : ''}">Рабочий вес</button><button data-a="metric" data-v="e" class="${metric === 'e' ? 'on' : ''}">Расчётный 1ПМ</button></div>`;
  const pts = cur.h.map(x => { const t = topSet(x); return {x, v: metric === 'e' ? bestE1(x) : t ? t.w : NaN}; }).filter(q => !isNaN(q.v) && q.v > 0);
  h += `<div class="card">${pts.length ? chart(pts) : '<p class="mut">Для этого упражнения нет записей с весом.</p>'}
    <p class="sm" style="margin-top:6px"><span class="pill h">Т</span> тяжёлая <span class="pill m">С</span> средняя <span class="pill l">Л</span> лёгкая</p></div>`;
  let pr = null, be = NaN;
  for (const x of cur.h) { const t = topSet(x); if (t && (!pr || t.w > pr.w)) pr = Object.assign({d: x.date}, t); const b = bestE1(x); if (!isNaN(b) && (isNaN(be) || b > be)) be = b; }
  if (pr && pr.w) h += `<div class="row" style="gap:10px;margin-top:12px"><div class="stat g1"><p class="sm">Рекорд</p><p class="v">${fw(pr.w)}${isNaN(pr.r) ? '' : ' × ' + pr.r}</p><p class="sm">${esc(fdate(pr.d))}</p></div>
    <div class="stat g1"><p class="sm">Расчётный 1ПМ</p><p class="v">${isNaN(be) ? '—' : fw(Math.round(be * 2) / 2)}</p><p class="sm">формула Эпли</p></div></div>`;
  h += `<p class="sec">История</p>` + cur.h.slice().reverse().map(x => `<div class="row sp" style="border-bottom:1px solid var(--bd);padding:8px 0">
    <span class="g1"><span class="mut">${esc(fdate(x.date))} · нед. ${x.wn}</span><br>${esc(summ(x))}</span><span class="pill ${x.type}">${TYPES[x.type]}</span></div>`).join('');
  return h + cs;
}
function chart(pts) {
  const W = 340, H = 190, L = 40, R = 10, T = 12, B = 26;
  let mn = Math.min(...pts.map(q => q.v)), mx = Math.max(...pts.map(q => q.v));
  if (mn === mx) { mn -= 5; mx += 5; } const pad = (mx - mn) * .1; mn -= pad; mx += pad;
  const X = i => pts.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
  const Y = v => T + (mx - v) * (H - T - B) / (mx - mn);
  const col = {h: 'var(--h)', m: 'var(--m)', l: 'var(--l)'};
  let g = '';
  for (let k = 0; k <= 3; k++) { const v = mn + (mx - mn) * k / 3, y = Y(v); g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="var(--bd)"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--tx3)">${fw(Math.round(v))}</text>`; }
  const path = pts.map((q, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(q.v).toFixed(1)).join(' ');
  const step = Math.ceil(pts.length / 5);
  const lab = pts.map((q, i) => (i % step === 0 || i === pts.length - 1) ? `<text x="${X(i)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--tx3)">${esc(q.x.date.slice(8, 10) + '.' + q.x.date.slice(5, 7))}</text>` : '').join('');
  const dots = pts.map((q, i) => `<circle cx="${X(i)}" cy="${Y(q.v)}" r="4.5" fill="${col[q.x.type] || 'var(--ac)'}"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График прогресса">${g}<path d="${path}" fill="none" stroke="var(--ac)" stroke-width="2"/>${dots}${lab}</svg>`;
}

function applyPick(exId) {
  const p = P(), ctx = PK; closeSheet();

    const w = p.weeks[wkIdx()], o = WOS(V.wid), s = sess(w, o.id, true), pl = w.plan[o.id] || {t: {}};
    if (ctx.mode === 'extra') {

      s.extra.push(sl); s.e[sl.id] = {ex: exId, sets: [], w: '', c: [], note: '', rows: false};
    } else {
      const sl = slotsOf(o, s).find(x => x.id === ctx.sid);
      const e = s.e[sl.id] || (s.e[sl.id] = entry(s, pl, sl));
      if (e.ex !== exId) { e.ex = exId; e.sets = []; e.w = ''; e.c = []; }
      const ps = o.slots.find(x => x.id === sl.id);
      if (ps && exId !== ps.ex && !ps.alts.includes(exId)) ps.alts.push(exId); // запоминаем как альтернативу
    }

    const x = V.draft.w[ctx.wid].t[ctx.sid]; x.ex = exId;
    const o = WO(ctx.wid), sl = o.slots.find(q => q.id === ctx.sid);

    if (exId !== sl.ex && !sl.alts.includes(exId)) sl.alts.push(exId);
  } else {
    const o = WO(ctx.wid), sl = o && o.slots.find(x => x.id === ctx.sid);
    if (ctx.mode === 'alt') { if (exId !== sl.ex && !sl.alts.includes(exId)) sl.alts.push(exId); }
    else if (ctx.mode === 'swap') { if (exId !== sl.ex) { sl.alts = sl.alts.filter(a => a !== exId); sl.alts.unshift(sl.ex); sl.ex = exId; } }
    else if (ctx.mode === 'addslot') { const n = {id: uid(), ex: exId, alts: [], acc: false, sets: 4, rmin: 8, rmax: 10}; o.slots.push(n); V.edit = n.id; }
  }
  save(); render();
}

/* ========== Действия ========== */
function curSess() { const w = P().weeks[wkIdx()], o = WOS(V.wid); return {w, o, s: sess(w, o.id, true), pl: w.plan[o.id] || {t: {}}}; }
function touch(s) { if (!s.date) { s.date = today(); const d = document.querySelector('[data-i=sdate]'); if (d) d.value = s.date; } if (!s.by) s.by = S.owner; }
function ent(sid) {
  const {o, s, pl} = curSess(); const sl = slotsOf(o, s).find(x => x.id === sid);

}

    case 'chipadd': { const {e, sl} = ent(v); while (e.c.length < sl.sets) e.c.push(false); e.c.push(false); break; }
    case 'pick': { const {e} = ent(v); openPicker({mode: 'entry', wid: V.wid, sid: v, cur: e.ex}); return; }

    }

      const w = p.weeks[wkIdx()], wi = wkIdx(), l = (w.cardio || []).slice(-1)[0] || (wi ? (p.weeks[wi - 1].cardio || []).slice(-1)[0] : null); if (!l) return;

    }
    case 'cdel': { const w = p.weeks[wkIdx()]; if (!confirm('Удалить эту запись кардио?')) return; w.cardio = (w.cardio || []).filter(c => c.id !== v); break; }

    case 'pdec': { const x = V.draft.w[wid].t[sid]; x.dec = +v; x.w = fw(x.baseW + EX(x.ex).step * x.dec); render(); return; }
    case 'ptype': V.draft.w[wid].type = v; render(); return;

    case 'psave': {
      const D = V.draft, plan = {};
      for (const k in D.w) { plan[k] = {type: D.w[k].type, off: D.w[k].off, t: {}}; for (const s in D.w[k].t) { const x = D.w[k].t[s]; plan[k].t[s] = {ex: x.ex, w: x.w, r: x.r, s: x.s}; } }
      if (D.mode === 'next') { p.weeks.push(newWeek(p.weeks[p.weeks.length - 1].n + 1, plan)); save(); V.draft = null; go({tab: 'week', wk: p.weeks.length - 1}, true); toast('Неделя создана'); }
      else { const w = p.weeks[D.ti]; w.plan = plan; for (const k in w.sessions) { const s = w.sessions[k]; if (!hasData(s)) s.type = plan[k] ? plan[k].type : s.type; } save(); V.draft = null; history.back(); toast('Цели сохранены'); }
      return;
    }
    case 'metric': V.metric = v; render(); return;
    case 'sedit': V.edit = V.edit === v ? null : v; render(); return;
    case 'sadd': openPicker({mode: 'addslot', wid: v}); return;
    case 'aadd': openPicker({mode: 'alt', wid, sid: v}); return;
    case 'sswap': openPicker({mode: 'swap', wid, sid: v}); return;
    case 'adel': { const sl = WO(wid).slots.find(x => x.id === sid); sl.alts = sl.alts.filter(x => x !== v); break; }
    case 'amain': { const sl = WO(wid).slots.find(x => x.id === sid); sl.alts = sl.alts.filter(x => x !== v); sl.alts.unshift(sl.ex); sl.ex = v; break; }
    case 'sup': case 'sdown': { const o = WO(wid), i = o.slots.findIndex(x => x.id === v), j = i + (a === 'sup' ? -1 : 1); if (j < 0 || j >= o.slots.length) return; [o.slots[i], o.slots[j]] = [o.slots[j], o.slots[i]]; break; }
    case 'sdel': { const o = WO(wid); if (!confirm('Убрать «' + EX(o.slots.find(x => x.id === v).ex).name + '» из программы? Старые записи останутся в истории.')) return; o.slots = o.slots.filter(x => x.id !== v); break; }

    case 'wdel': { const o = WO(v); if (!confirm('Удалить «' + o.name + '» из программы? Записи прошлых недель останутся в файле копии, но не будут видны.')) return; p.workouts = p.workouts.filter(x => x.id !== v); break; }

    case 'import': document.getElementById('file').click(); return;

document.addEventListener('input', ev => {
  const t = ev.target, k = t.dataset.i; if (!k) return;
  const v = t.value, sid = t.dataset.s, wid = t.dataset.w;
  switch (k) {
    case 'sw': case 'sr': { const {e, s} = ent(sid); const n = +t.dataset.n; while (e.sets.length <= n) e.sets.push({w: '', r: ''}); e.sets[n][k === 'sw' ? 'w' : 'r'] = v; touch(s);
      const row = t.closest('.setr'); if (k === 'sw') refreshRow(row); else row.querySelector('.i').classList.toggle('on', num(v) > 0);
      const all = [...document.querySelectorAll('[data-i=sr]')], d = all.filter(i => num(i.value) > 0).length, bar = document.querySelector('#app .bar i'), cnt = document.querySelector('#app .bar + .sm');
      if (bar && cnt) { const m = cnt.textContent.match(/из (\d+)/); const tot = m ? +m[1] : all.length; bar.style.width = Math.round(d / tot * 100) + '%'; cnt.textContent = 'Подходов записано: ' + d + ' из ' + tot; }
      break; }
    case 'aw': { const {e, s} = ent(sid); e.w = v; touch(s); break; }
    case 'enote': { const {e} = ent(sid); e.note = v; break; }
    case 'snote': { const {s} = curSess(); s.note = v; break; }
    case 'stitle': { const {s} = curSess(); s.title = v; break; }
    case 'sdate': { const {s} = curSess(); s.date = v; break; }
    case 'pw': case 'pr': case 'ps': { const x = V.draft.w[wid].t[sid]; x[{pw: 'w', pr: 'r', ps: 's'}[k]] = v; if (k === 'pw') x.dec = null; return; }
    case 'pq': PK.q = v; renderSheet(true); return;
    case 'pex': V.ex = v; render(); return;
    case 'wname': WO(wid).name = v; break;
    case 'wfocus': WO(wid).focus = v; break;
    case 'ssets': case 'srmin': case 'srmax': { const sl = WO(wid).slots.find(x => x.id === sid), n = parseInt(v, 10); if (n > 0) sl[{ssets: 'sets', srmin: 'rmin', srmax: 'rmax'}[k]] = n; break; }
    case 'exstep': { const n = num(v); if (n >= 0) S.cat[t.dataset.v].step = n; break; }
    case 'pname': S.profiles[t.dataset.v].name = v; save(); { const b = document.getElementById('top').querySelector(`[data-v="${t.dataset.v}"]`); if (b) { b.querySelector('.g1').textContent = v; b.querySelector('.av').textContent = initials(v); } } return;

document.addEventListener('focusin', ev => {
  const t = ev.target; if (t.dataset.i !== 'sw' || t.value !== '') return;
  const ph = t.placeholder; if (isNaN(num(ph))) return;
  t.value = ph; t.dispatchEvent(new Event('input', {bubbles: true})); setTimeout(() => t.select(), 0);
  const r = t.parentNode.querySelector('[data-i=sr]'); if (r) refreshRow(t.parentNode);
});
function refreshRow(row) { // подсказка веса в следующем подходе = вес этого подхода
  const nx = row.nextElementSibling; if (!nx || !nx.classList.contains('setr')) return;
  const w = nx.querySelector('[data-i=sw]'), cur = row.querySelector('[data-i=sw]'); if (w && !w.value && cur.value) w.placeholder = cur.value;
}
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.i === 'sacc') { const sl = WO(t.dataset.w).slots.find(x => x.id === t.dataset.s); sl.acc = t.checked; save(); render(); }

    const r = new FileReader();
    r.onload = () => { try { const d = JSON.parse(r.result); if (!d || d.v !== 1 || !d.profiles) throw new Error('не тот файл');
      if (!confirm('Заменить все данные на этом телефоне данными из копии?')) return; S = d; save(); go({tab: 'week'}, true); toast('Данные восстановлены'); }
      catch (e) { toast('Не получилось: ' + e.message); } };

});
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function csv() {
  const rows = [['Профиль', 'Неделя', 'Тренировка', 'Дата', 'Тип', 'Упражнение', 'Подход', 'Вес', 'Повторы', 'Отмечен', 'Заметка']];
  for (const id of S.order) { const p = S.profiles[id];
    for (const w of p.weeks) for (const wid in w.sessions) { const s = w.sessions[wid], o = p.workouts.find(x => x.id === wid) || {name: s.title || 'Своя тренировка'};
      for (const sid in s.e) { const e = s.e[sid], base = [p.name, w.n, o ? o.name : '', s.date, TYPES[s.type], EX(e.ex).name];
        if (e.sets && e.sets.length) e.sets.forEach((x, i) => rows.push(base.concat([i + 1, x.w, x.r, x.d ? 'да' : '', e.note])));
        else (e.c || []).forEach((c, i) => rows.push(base.concat([i + 1, e.w, '', c ? 'да' : '', e.note]))); } } }
  for (const id of S.order) for (const w of S.profiles[id].weeks) for (const c of (w.cardio || [])) rows.push([S.profiles[id].name, w.n, 'Кардио', c.date, '', c.kind, '', c.km ? c.km + ' км' : '', c.min + ' мин', '', c.note || '']);
  return rows.map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(';')).join('\r\n');
